"on":
  workflow_dispatch:
  push:
    branches:
      - develop_report**

name: Quarto Publish

env:
  PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

permissions:
  contents: read
  pages: write
  id-token: write

on:
  push:
    branches:
      - develop

permissions:
  contents: write

jobs:
  deploy-preview:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Render
        working-directory: rapportage/slm2026
        run: quarto render

      - name: Deploy preview
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: rapportage/slm2026/_book
          destination_dir: preview/${{ github.ref_name }}
          keep_files: true
